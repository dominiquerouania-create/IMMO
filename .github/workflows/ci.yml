name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: kairos, POSTGRES_PASSWORD: kairos, POSTGRES_DB: kairos }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kairos" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kairos:kairos@localhost:5432/kairos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kairos/core build
      - name: Tests du moteur (planification, scoring, rappels, NLP)
        run: pnpm --filter @kairos/core test
      - name: Migrations
        run: pnpm --filter @kairos/api exec prisma migrate deploy
      - name: API — typecheck, tests, build
        run: |
          pnpm --filter @kairos/api typecheck
          pnpm --filter @kairos/api test
          pnpm --filter @kairos/api build
      - name: Web — typecheck et build
        run: |
          pnpm --filter @kairos/web typecheck
          pnpm --filter @kairos/web build
      - name: Mobile — typecheck
        run: pnpm --filter @kairos/mobile typecheck
